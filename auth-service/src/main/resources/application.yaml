server:
  port: 9000

spring:
  application:
    name: auth-service

  security:
    oauth2:
      resourceserver:
        opaquetoken:
          # Auth Server проверяет сам себя
          introspection-uri: http://localhost:9000/oauth2/introspect
          client-id: auth-server
          client-secret: ${AUTH_SERVER_SECRET:secret}

  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

auth:
  token:
    access-token-ttl: 900000

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha
  open-api:
    info:
      title: "Auth Service API"
      version: "0.1.0"
      description: "Authentication Service"
    components:
      security-schemes:
        bearerAuth:
          type: http
          scheme: bearer
          bearer-format: JWT
    security:
      - bearerAuth: []

logging:
  level:
    org.springframework.security: INFO
    ru.jobtracker.auth_service: DEBUG
